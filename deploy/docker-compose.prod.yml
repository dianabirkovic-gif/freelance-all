# Production stack: Caddy (SPA + /api proxy + HTTPS) -> backend -> Postgres.
# Lives in freelance-all/deploy; frilance-backend and frilance-frontend must be
# sibling checkouts of freelance-all. Only Caddy publishes ports. Run from this
# directory with a .env next to it
# (copy .env.example; never commit it):
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build
# Never use `down -v` on a host holding real data (it deletes the pgdata volume).
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-frilanceos}
      POSTGRES_USER: ${DB_USERNAME:-frilanceos}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-frilanceos} -d ${DB_NAME:-frilanceos}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  backend:
    build: ../../frilance-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-frilanceos}
      DB_USERNAME: ${DB_USERNAME:-frilanceos}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?set CORS_ALLOWED_ORIGINS in .env}
      JWT_ACCESS_TOKEN_TTL_MINUTES: ${JWT_ACCESS_TOKEN_TTL_MINUTES:-1440}
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
    logging: *logging

  web:
    build:
      context: ../../frilance-frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    logging: *logging

volumes:
  pgdata:
  caddy_data:
  caddy_config:
